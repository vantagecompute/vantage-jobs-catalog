name: Build and Publish Job Scripts

on:
  workflow_dispatch:
    inputs:
      job-script-names:
        description: Comma-separated list of job script names to build and publish
        required: true
        type: string

# Set the repository variable USE_SELF_HOSTED_RUNNERS to "true" to run every
# job below in the vantage-eng runner group; otherwise they run on GitHub-hosted
# ubuntu-26.04. SELF_HOSTED_RUNS_ON, a runs-on value in JSON such as
# ["self-hosted", "Linux", "X64"], replaces the default runner set.
jobs:
  catalog-cd:
    runs-on: ${{ vars.USE_SELF_HOSTED_RUNNERS == 'true' && fromJSON(vars.SELF_HOSTED_RUNS_ON || '{"group":"vantage-eng","labels":["X64"]}') || 'ubuntu-26.04' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.8.0'
          package-manager-cache: ${{ runner.environment == 'github-hosted' }}

      # setup-poetry pip-installs Poetry into the python on PATH. On a
      # self-hosted runner that is the system Python, which refuses pip
      # installs (PEP 668), so put the setup-python one first.
      - name: Set up Python for Poetry
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Install Poetry
        uses: Gr1N/setup-poetry@48b0f77c8c1b1b19cb962f0f00dff7b4be8f81ec # v9
        with:
          poetry-version: 1.8.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Self-hosted runners keep Poetry's cache on local disk.
          cache: ${{ runner.environment == 'github-hosted' && 'poetry' || '' }}

      - name: Install CDK
        run: |
          npm install -g aws-cdk@2.162.1

      - name: Cache cdk.out
        if: runner.environment == 'github-hosted'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: cdk.out
          key: cdk-out

      - name: Setup AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.S3_BUCKET_REGION }}

      - name: Install Python packages
        run: |
          poetry install --with=infra

      - name: Install Apptainer
        run: |
          sudo apt install -y software-properties-common
          sudo add-apt-repository -y ppa:apptainer/ppa
          sudo apt update
          sudo apt install -y apptainer

      - name: Configure settings
        run: |
          poetry run builder settings set \
          --aws-access-key-id ${{ secrets.AWS_ACCESS_KEY_ID }} \
          --aws-secret-access-key ${{ secrets.AWS_SECRET_ACCESS_KEY }} \
          --s3-bucket ${{ vars.S3_BUCKET }} \
          --s3-bucket-region ${{ vars.S3_BUCKET_REGION }}

      - name: Build job scripts images
        run: |
          job_script_names="${{ github.event.inputs.job-script-names }}"
          job_script_names_spaced=$(echo $job_script_names | sed 's/,/ /g')
          poetry run builder --verbose apptainer build $job_script_names_spaced

      - name: Publish job scripts images
        run: |
          job_script_names="${{ github.event.inputs.job-script-names }}"
          job_script_names_spaced=$(echo $job_script_names | sed 's/,/ /g')
          poetry run builder --verbose apptainer publish $job_script_names_spaced

      - name: Publish job scripts artifacts
        run: |
          job_script_names="${{ github.event.inputs.job-script-names }}"
          job_script_names_spaced=$(echo $job_script_names | sed 's/,/ /g')
          poetry run builder --verbose files publish $job_script_names_spaced

      - name: Generate the catalog.yaml file
        run: |
          poetry run builder --verbose catalog generate

      - name: Publish the catalog.yaml file
        run: |
          cdk deploy --require-approval never VantageJobsCatalogWebsite